name: Research probe (temporary)
# Temporary research workflow on the claude/probe branch only. It never touches
# main, seen.json or the running monitor. Safe to delete with the branch.
on:
  push:
    branches: [claude/probe]
    paths: [probe.py, .github/workflows/probe.yml, probe_trigger.txt]

permissions:
  contents: write

concurrency:
  group: research-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/probe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "curl_cffi>=0.7.0"
      - name: Run probe
        env:
          PROBE_ONLY: ${{ vars.PROBE_ONLY }}
        run: python probe.py 2>&1 | tee probe_log.txt
      - name: Save report to the probe branch
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -f probe_report.json probe_log.txt || true
          git commit -m "probe report [skip ci]" || exit 0
          git push origin HEAD:claude/probe
