name: Hot Wheels Monitor
# FirstCry-only runs show up as "Hot Wheels Monitor (firstcry)" in the Actions list
run-name: ${{ inputs.only && format('Hot Wheels Monitor ({0})', inputs.only) || 'Hot Wheels Monitor' }}

on:
  workflow_dispatch:        # lets you run it manually and lets cron-job.org trigger it
    inputs:
      only:
        description: "Check only these stores (e.g. firstcry). Empty = all stores."
        required: false
        default: ""
  schedule:
    # Backup only — cron-job.org drives the real cadence (GitHub's own scheduler
    # is throttled and often 15-60 min late).
    - cron: "*/15 * * * *"

permissions:
  contents: write           # needed so the job can commit seen.json back

# If a run is still going when the next fires, skip the new one instead of stacking.
concurrency:
  group: hw-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8      # kill runaway jobs to protect your free minutes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No browser step: the bot is pure HTTP (curl_cffi), which is why it runs
      # in seconds and never hits the old chrome-headless-shell failure.

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Set by the every-minute FirstCry trigger; empty on normal runs = all stores.
          ONLY_SOURCES: ${{ inputs.only || '' }}

          # ── Alerts ───────────────────────────────────────────────────────────
          SILENT: "true"            # only ping on real changes
          FIRST_RUN_SILENT: "true"  # first run learns a baseline silently
          MAX_ALERT_PRICE: "0"      # 0 = no price cap on NEW alerts
          DEBUG: "false"
          # Keywords that get an extra 🎯 flag in alerts.
          WATCHLIST: "rlc,treasure hunt,team transport,car culture,boulevard,premium,silhouettes,kaido house,liberty walk"

          # ── Exclusions (apply to EVERY store) ────────────────────────────────
          # Monster trucks plus all big sets: track sets, playsets, garages, car
          # washes, launchers — and FirstCry's "Ultimate" line, which is entirely
          # playsets (Ultimate Garage, Octo Car Wash, Dual Dragon Transporter).
          # Matched on leading word boundaries, so "monster truck" also catches
          # "Monster Trucks" while "play set" can't hit "Display Sets".
          FC_EXCLUDE: "monster truck,monster jam,monstred,hopper ball,track set,trackset,track and,track with,track builder,track creator,playset,play set,race off,raceway,speedway,garage,car wash,loop dash,loop track,launch & loop,launcher,stunt track,hot wheels city,ultimate garage,super loop,pit stop,action set,crash & track,ultimate"

          # ── FirstCry ─────────────────────────────────────────────────────────
          # FirstCry is read through its own JSON catalogue API (whole catalogue,
          # sold-out cars included, exact stock counts). If that API is ever
          # unavailable the bot falls back to HTML scraping automatically, and the
          # settings below apply to that fallback.

          # Marques/lines to AUTO-WATCH — flagged 🎯 and guarded closely.
          FC_MARQUES: "porsche,ferrari,lamborghini,supra,skyline,gt-r,gtr,nissan,datsun,rx-7,rx7,mazda,civic,type r,nsx,honda,toyota,ae86,silvia,evo,lancer,subaru,wrx,impreza,celica,mr2,bmw,m3,m4,audi,rs6,mercedes,amg,bugatti,mclaren,aston martin,koenigsegg,pagani,alfa romeo,countach,aventador,huracan,diablo,testarossa,f40,f50,911,930,993,959,carrera,singer,mustang,corvette,camaro,challenger,charger,plymouth,premium,car culture,team transport,boulevard,rlc,treasure hunt,silver series,fast furious,exotics,legends,silhouettes,japan historics,modern classics"
          # Hand-picked products (your FirstCry Shortlist). URLs or IDs, comma separated.
          FC_WATCH: "https://www.firstcry.com/hot-wheels/hot-wheels-premium-fast-and-furious-die-cast-toy-car-for-adult-collectors-orange/21161951/product-detail"
          # HTML-fallback tuning only (unused while the JSON API works).
          FC_WATCH_MAX: "25"
          FC_ROTATE_PER_RUN: "18"
          # NOTE: do NOT set FC_LISTING_URLS — leaving it unset keeps the
          # fallback's rotating sweep enabled.

          # ── Minifygram ───────────────────────────────────────────────────────
          # Optional: only needed if Minifygram ever rotates its public anon key.
          MINIFYGRAM_ANON_KEY: ${{ secrets.MINIFYGRAM_ANON_KEY }}
          MG_BRANDS: "hotwheels,mattel,minigt,mini gt,kaido house"

          # ── Karz & Dolls ─────────────────────────────────────────────────────
          # KD_URLS is deliberately NOT set: the built-in list covers all 16
          # Hot Wheels + MiniGT categories. Setting it overrides that list (this
          # once limited KND to blister packs only). If you ever do, separate
          # URLs with "|" not commas.

          # ── Quick commerce (blocked from GitHub's US runners) ────────────────
          BLINKIT_WATCH: "https://blinkit.com/prn/hot-wheels-164-scale-toy-car-colour-designs-may-vary-multicolour/prid/444563"
          BB_TERMS: "hot wheels,hotwheels"

          # ── Concurrency ──────────────────────────────────────────────────────
          SRC_WORKERS: "6"
          FC_WORKERS: "10"
          HM_WORKERS: "8"
        run: python bot.py

      - name: Save state
        run: |
          if ! git diff --quiet -- seen.json; then
            git config user.name  "github-actions"
            git config user.email "actions@github.com"
            git add seen.json
            git commit -m "chore: update seen.json [skip ci]"
            # Overlapping runs can move main between our checkout and push.
            # Rebase onto the latest remote (keeping THIS run's seen.json) and retry.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing onto latest main"
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort; git reset --hard origin/main; break; }
            done
          fi
