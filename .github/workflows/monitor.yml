name: Hot Wheels Monitor
run-name: Hot Wheels Monitor

on:
  workflow_dispatch:        # cron-job.org triggers this every minute
    inputs:
      only:
        # Kept so existing cron-job.org jobs that send it keep working. The bot
        # now decides by itself which stores are due on every run.
        description: "(not needed any more — every run checks whatever is due)"
        required: false
        default: ""
  schedule:
    # Backup only — cron-job.org drives the real cadence (GitHub's own scheduler
    # is throttled and often 15-60 min late).
    - cron: "*/15 * * * *"

permissions:
  contents: write           # needed so the job can commit seen.json back
  actions: read             # lets a run see whether the next run is already waiting

# One run at a time. A trigger that arrives while a run is going waits in line;
# if yet another arrives meanwhile, GitHub drops the older waiting one and it
# shows as a grey "cancelled" run — harmless, nothing is missed. Two
# cron-job.org jobs keep a run waiting almost all the time, so runs follow each
# other back to back; when none is waiting, the current run stays on
# (RUN_EXTEND_S) instead of leaving a gap.
concurrency:
  group: hw-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # ref: main = the LATEST state at start. Without it, a run that was queued
      # behind another one started from the state as it was when it was queued,
      # missed the previous run's alerts and sent them again (~28% of FirstCry
      # restock alerts were duplicates sent twice, 20-60 s apart).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -q --disable-pip-version-check -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # One chat id, or several separated by commas (e.g. you + a group).
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

          # ── Speed ───────────────────────────────────────────────────────────
          # Each run checks FirstCry 4 times, 12 s apart (at 0, 12, 24 and 36 s),
          # and ends before the next every-minute trigger, so FirstCry is
          # watched about every 15 s around the clock. Other stores are checked
          # in each run's first pass when due (see below).
          RUN_SECONDS: "40"
          FC_EVERY: "12"
          # If no next run is waiting when the 40 s are up (cron-job.org sent no
          # trigger in minutes ending in 5, and the :x0 one ~35 s late), the run
          # keeps checking up to this many seconds more, until one is waiting.
          RUN_EXTEND_S: "80"
          GITHUB_TOKEN: ${{ github.token }}
          # The full FirstCry catalogue (sold-out cars too) every 2 min — a
          # brand-new car often shows units there minutes before FirstCry's
          # in-stock list has it (v16.3). Every check in between reads the
          # in-stock list.
          FC_CATALOGUE_EVERY: "120"
          # Seconds between checks for the other stores (-1 = off). Minifygram
          # also gets a tiny "anything changed?" check every 12 s, so its new
          # listings arrive within seconds; the full list is re-read every 2 min.
          MG_EVERY_S: "120"
          KD_EVERY_S: "120"
          HM_EVERY_S: "600"

          # ── Alerts ───────────────────────────────────────────────────────────
          SILENT: "true"            # only ping on real changes
          FIRST_RUN_SILENT: "true"  # first run learns a baseline silently
          MAX_ALERT_PRICE: "0"      # 0 = no price cap on NEW alerts
          DEBUG: "false"
          # Keywords that get an extra 🎯 flag in alerts.
          WATCHLIST: "rlc,treasure hunt,team transport,car culture,boulevard,premium,silhouettes,kaido house,liberty walk"

          # ── Ringing alerts (v17.5) ───────────────────────────────────────────
          # The cars you can't miss also come to your phone as a WhatsApp message
          # and a Telegram call that rings until you pick up (CallMeBot, free for
          # personal use). Off until these secrets are set (Settings → Secrets
          # and variables → Actions); each half works on its own:
          CALLMEBOT_WA_PHONE:  ${{ secrets.CALLMEBOT_WA_PHONE }}    # +91 and your number
          CALLMEBOT_WA_APIKEY: ${{ secrets.CALLMEBOT_WA_APIKEY }}   # the key CallMeBot sent you
          CALLMEBOT_TG_USER:   ${{ secrets.CALLMEBOT_TG_USER }}     # @yourname (or +91 and your number)
          # What rings (27 Oct): Porsche, Skyline and Ferrari only — their
          # Treasure Hunts too, even at night. Whole words, in the car's name or
          # its case-checklist series. (CallMeBot's free calls come ~1 min late.)
          RING_ON: "porsche,911,930,934,935,959,964,993,918,carrera,singer,taycan,skyline,ferrari,laferrari,testarossa,f40,f50,enzo,sf90"
          RING_KINDS: ""              # Treasure Hunts of other cars don't ring (of these three they do)
          RING_CAR_H: "12"            # the same car rings at most every 12 h
          RING_GAP_MIN: "3"           # minutes between two calls (WhatsApp still goes)
          RING_QUIET: "00:00-07:00"   # no calls then (India time), except Treasure Hunts; "" = any hour

          # ── Exclusions (apply to EVERY store) ────────────────────────────────
          # Monster trucks plus all big sets: track sets, playsets, garages, car
          # washes, launchers — and FirstCry's "Ultimate" line (all playsets).
          # Also Hot Wheels-branded merchandise that isn't a car (water bottles,
          # sunglasses, watches, T-shirts, lunch boxes… FirstCry lists them too).
          # Matched on leading word boundaries, so "monster truck" also catches
          # "Monster Trucks" while "play set" can't hit "Display Sets".
          # v17.3: monster trucks are kept out however a store spells them
          # ("Monster Toy Truck", "MONST ER TRUCKS"), except their chase pieces —
          # a Treasure Hunt / chase the store names as such alerts as 🏆 / ⛓️.
          # Matchbox and Majorette are tracked the same way: chase pieces only
          # (Super Chase, chase cars, Treasure Hunts). CHASE_ONLY_LINES: "false"
          # turns that off.
          FC_EXCLUDE: "monster truck,monster jam,monstred,hopper ball,track set,trackset,track and,track with,track builder,track creator,playset,play set,race off,raceway,speedway,garage,car wash,loop dash,loop track,launch & loop,launcher,stunt track,hot wheels city,ultimate garage,super loop,pit stop,action set,crash & track,ultimate,water bottle,sipper,canteen,sunglass,digital watch,wrist watch,t-shirt,tshirt,sweatshirt,sandwich box,lunch box,tiffin,play ball,school bag,backpack,umbrella,raincoat,socks,slippers,sandals,shoes,bicycle,car case,storage case,carry case,storage box"

          # ── FirstCry ─────────────────────────────────────────────────────────
          # Marques/lines to AUTO-WATCH — flagged 🎯 and listed first in alerts.
          FC_MARQUES: "porsche,ferrari,lamborghini,supra,skyline,gt-r,gtr,nissan,datsun,rx-7,rx7,mazda,civic,type r,nsx,honda,toyota,ae86,silvia,evo,lancer,subaru,wrx,impreza,celica,mr2,bmw,m3,m4,audi,rs6,mercedes,amg,bugatti,mclaren,aston martin,koenigsegg,pagani,alfa romeo,countach,aventador,huracan,diablo,testarossa,f40,f50,911,930,993,959,carrera,singer,mustang,corvette,camaro,challenger,charger,plymouth,bentley,ford gt,premium,car culture,team transport,boulevard,rlc,treasure hunt,silver series,fast furious,exotics,legends,silhouettes,japan historics,modern classics"
          # Hand-picked products (your FirstCry Shortlist). URLs or IDs, comma separated.
          FC_WATCH: "https://www.firstcry.com/hot-wheels/hot-wheels-premium-fast-and-furious-die-cast-toy-car-for-adult-collectors-orange/21161951/product-detail"
          # v17: FirstCry's own checkout cart (a guest cart for 248001 — nothing
          # is stored or ordered) decides every FirstCry alert: no alert unless
          # your cart would take the car, and the alert shows the units it can
          # send you and the delivery date. Cars are asked this many per check
          # (🎯 cars get half the turns):
          FC_CART: "true"
          FC_CART_MAX: "150"
          # A 🎯 car the cart confirmed may alert again this many minutes after
          # its last alert; any other car at most once every this many hours.
          FC_CART_COOLDOWN_MIN: "30"
          FC_CART_COOLDOWN_OTHER_H: "6"
          # v14: every FirstCry alert is confirmed on the car's product page and
          # FirstCry's delivery check for your pincode (what the page itself uses)
          # before it's sent. Product pages of your 🎯 cars that are out of stock
          # are read directly — this many colour sets per pass:
          FC_LIVE_POLL: "4"
          # A restock confirmed on the product page may alert again after this
          # many hours (unconfirmed ones keep 24 h).
          FC_RESTOCK_COOLDOWN_H: "1"
          # Units that must be orderable for 248001 before FirstCry alerts: 1 for
          # your 🎯 cars (worth a try even when it's the last one), 2 for the rest
          # (single units of other cars came and went within minutes all day).
          FC_MIN_ALERT_STOCK_TARGET: "1"
          FC_MIN_ALERT_STOCK: "2"
          # …and only once FirstCry's in-stock list for your pincode shows the
          # car: the product page counts units for the whole country, and cars
          # off that list kept turning out "Cannot be delivered to 248001" or
          # "just went out of stock" in the cart (v16.1, v16.4). A car whose
          # alert was gone within minutes then needs this many units for 12 h
          # ("0" turns these checks off).
          FC_SURE_UNITS: "5"
          # Catalogue pages fetched at once. If the log ever shows HTTP 429,
          # FirstCry is objecting to the pace — set this to "5".
          FC_API_PARALLEL: "10"
          # HTML-fallback tuning only (unused while the JSON API works).
          FC_WATCH_MAX: "25"
          FC_ROTATE_PER_RUN: "18"

          # ── Minifygram ───────────────────────────────────────────────────────
          # Optional: only needed if Minifygram ever rotates its public anon key.
          MINIFYGRAM_ANON_KEY: ${{ secrets.MINIFYGRAM_ANON_KEY }}
          # (Matchbox / Majorette chase pieces come in on their own, v17.3.)
          MG_BRANDS: "hotwheels,mattel,minigt,mini gt,kaido house"
          # Categories tracked whatever the brand — trading cards.
          MG_CATEGORIES: "trading card,tcg"

          # ── Karz & Dolls ─────────────────────────────────────────────────────
          # KD_URLS is deliberately NOT set: the built-in list covers every Hot
          # Wheels + MiniGT category, chase cars, special stocks and the home
          # page's New Arrivals — and (v17.3) the Matchbox, Majorette and monster
          # truck shelves, for their chase pieces. Setting it overrides that list.

          # ── Concurrency ──────────────────────────────────────────────────────
          SRC_WORKERS: "6"
          FC_WORKERS: "10"
          HM_WORKERS: "8"
        run: python bot.py

      - name: Save state
        run: |
          if ! git diff --quiet -- seen.json; then
            git config user.name  "github-actions"
            git config user.email "actions@github.com"
            git add seen.json
            git commit -q -m "chore: update seen.json [skip ci]"
            # If main moved meanwhile, rebase onto it (keeping THIS run's
            # seen.json, which already includes everything it started from).
            for attempt in 1 2 3; do
              if git push -q; then
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing onto latest main"
              git fetch -q origin main
              git rebase -X theirs origin/main || { git rebase --abort; git reset --hard origin/main; break; }
            done
          fi
