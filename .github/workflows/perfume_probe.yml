name: Perfume probe (temporary)
# Temporary, claude/probe only: runs the new multi-store perfume.py exactly the
# way perfume.yml will (sparse checkout, memory on its own branch) for 2.5
# minutes against the real stores, with no Telegram — would-be messages are
# only written to the log. Its memory goes to perfume-state-probe, never main.
on:
  push:
    branches: [claude/probe]
    paths: [perfume.py, .github/workflows/perfume_probe.yml]
permissions:
  contents: write
concurrency:
  group: perfume-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/probe
          sparse-checkout: perfume.py
          sparse-checkout-cone-mode: false
      - name: Seed a test memory branch with main's perfume.json (first version)
        run: |
          ls -la
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:perfume.json > seed.json
          blob=$(git hash-object -w seed.json)
          tree=$(printf '100644 blob %s\tperfume.json\n' "$blob" | git mktree)
          commit=$(git -c user.name=github-actions -c user.email=actions@github.com commit-tree "$tree" -m "seed")
          git push -q -f origin "$commit:refs/heads/perfume-state-probe"
      - name: Watch (2.5 minutes, no Telegram)
        env:
          PERFUME_STATE: perfume-state.json
          PERFUME_STATE_BRANCH: perfume-state-probe
          PERFUME_MAX_RUN_S: "150"
          PERFUME_SALES_FIRST_S: "20"
          PERFUME_SALES_EVERY_S: "60"
          PERFUME_PUSH_EVERY_S: "45"
        run: python3 perfume.py 2>&1 | tee perfume_probe_log.txt
      - name: Report to perfume-probe-report
        if: always()
        run: |
          git fetch -q --depth=1 origin perfume-state-probe && git show FETCH_HEAD:perfume.json > state.json || echo '{}' > state.json
          git log -1 --format='%H %P %s' FETCH_HEAD > branch_head.txt || true
          python3 --version >> branch_head.txt
          ls -la >> branch_head.txt
          lines=""
          for f in perfume_probe_log.txt state.json branch_head.txt; do
            [ -f "$f" ] || continue
            lines="$lines$(printf '100644 blob %s\t%s' "$(git hash-object -w "$f")" "$f")"$'\n'
          done
          tree=$(printf '%s' "$lines" | git mktree)
          commit=$(git -c user.name=github-actions -c user.email=actions@github.com commit-tree "$tree" -m "perfume probe report [skip ci]")
          git push -q -f origin "$commit:refs/heads/perfume-probe-report"
